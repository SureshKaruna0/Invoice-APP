name: quick_invoice_maker
description: Offline invoice PDF maker built with Flutter.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.13.4
  cupertino_icons: ^1.0.8
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  go_router: ^14.6.2
  image_picker: ^1.2.4
  flutter_screenutil: ^5.9.3
  google_mlkit_text_recognition: ^0.16.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

dependency_overrides:
  archive: ^4.5.2
